# Syncs Google reviews into reviews.json (rendered as the "Avis clients"
# section on the homepage). Runs daily; GitHub Pages redeploys on commit.
#
# SETUP (one-time):
#   1. Google Cloud Console -> create/select a project
#   2. "APIs & Services" -> enable "Places API (New)"
#   3. "Credentials" -> Create API key (restrict it to Places API (New))
#   4. GitHub repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret: PLACES_API_KEY = <the key>
#   5. (optional) secret PLACE_ID to pin the exact place and skip text search
#
# Without the PLACES_API_KEY secret the job exits quietly and changes nothing.
# Note: the Places API returns at most 5 reviews.

name: Sync Google reviews

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch reviews from Google Places API
        env:
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PLACE_ID: ${{ secrets.PLACE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${PLACES_API_KEY}" ]; then
            echo "PLACES_API_KEY secret not set - skipping (see comments in this workflow)."
            exit 0
          fi

          PID="${PLACE_ID:-}"
          if [ -z "$PID" ]; then
            # Text search is fuzzy: while this profile is not indexed by the
            # Places API, a query can resolve to a COMPETITOR (this happened:
            # NR PROCLEAN's reviews were imported on 2026-07-04). Only accept
            # a text-search hit whose display name clearly matches the brand.
            curl -sf -X POST "https://places.googleapis.com/v1/places:searchText" \
              -H "Content-Type: application/json" \
              -H "X-Goog-Api-Key: ${PLACES_API_KEY}" \
              -H "X-Goog-FieldMask: places.id,places.displayName" \
              -d '{"textQuery":"Lena'\''s Cleaning Services nettoyage Liège","languageCode":"fr","regionCode":"BE"}' \
              -o /tmp/search.json
            PID=$(jq -r '.places[]? | select(.displayName.text | test("lena"; "i")) | .id' /tmp/search.json | head -n1)
            if [ -z "$PID" ]; then
              echo "No place matching 'Lena' found via text search - skipping until the profile is indexed (or set the PLACE_ID secret)."
              exit 0
            fi
            echo "Resolved place_id: $PID ($(jq -r '.places[]? | select(.displayName.text | test("lena"; "i")) | .displayName.text' /tmp/search.json | head -n1))"
          fi

          curl -sf "https://places.googleapis.com/v1/places/${PID}?languageCode=fr&regionCode=BE" \
            -H "X-Goog-Api-Key: ${PLACES_API_KEY}" \
            -H "X-Goog-FieldMask: displayName,rating,userRatingCount,reviews" \
            -o /tmp/place.json

          # Belt and braces: never publish reviews from a place whose name
          # does not contain the brand, even when PLACE_ID was set manually.
          NAME=$(jq -r '.displayName.text // ""' /tmp/place.json)
          if ! echo "$NAME" | grep -qi "lena"; then
            echo "Refusing to sync: resolved place is '$NAME', not a Lena's Cleaning profile."
            exit 1
          fi

          jq --arg url "https://share.google/6aF1GvvlgEsAzS6rc" '{
            source: "google",
            profileUrl: $url,
            rating: (.rating // 0),
            count: (.userRatingCount // 0),
            updated: (now | todate),
            reviews: [ (.reviews // [])[] | {
              author: .authorAttribution.displayName,
              rating: .rating,
              text: (.text.text // ""),
              date: (.relativePublishTimeDescription // ""),
              time: (.publishTime // "")
            } ]
          }' /tmp/place.json > /tmp/reviews.json

          # commit only when something other than the timestamp changed
          if [ -f reviews.json ] && \
             cmp -s <(jq 'del(.updated)' reviews.json) <(jq 'del(.updated)' /tmp/reviews.json); then
            echo "No review changes."
            exit 0
          fi
          mv /tmp/reviews.json reviews.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews.json
          git commit -m "chore: sync Google reviews"
          git push
